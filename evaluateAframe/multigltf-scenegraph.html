<html>
  <head>
    <script src="./src/aframe.min.js"></script>
    <script src="./src/jquery.min.js"></script>
  </head>
  <body>
    <script>
      const clickTimeAbsMs = performance.now() + performance.timeOrigin;
      console.log('click time', clickTimeAbsMs);

      let loaded=false;
      AFRAME.registerComponent('measure-fps', {
        schema: {
            startFlag: {type: 'bool', default:true},
            frameCount: {type: 'int', default: 0},
            startTime: {type:'float', default: 0},
            shouldLog: {type: 'bool', default: true}
        },
        init: function () {
          this.data.startFlag = true;
          this.data.frameCount = 0;
          this.data.startTime = 0;
          this.data.shouldLog = true;
          this.frameSum = 0;
          this.frameStart = performance.now();
        },
        tick: function () {
          this.frameStart = performance.now();
        },
        tock: function () {
          if (!loaded) return;

          const frameEnd = performance.now();
          this.frameSum += frameEnd - this.frameStart;
          const time = frameEnd;

          if (this.data.startFlag) {
              this.data.startTime = time;
              this.data.startFlag = false;
              console.log('startTime', this.data.startTime + performance.timeOrigin);
          }

          this.data.frameCount += 1;
          if(this.data.frameCount % 1000 === 0) {
              let fps = 1000 * this.data.frameCount / (time - this.data.startTime);
              let ft = this.frameSum/this.data.frameCount;
              console.log(this.data.frameCount,fps,'fps',ft,'ft');
          } 
          if ((time - this.data.startTime) /1000 > 60 && this.data.shouldLog){
              this.data.shouldLog = false;
              let fps = 1000 * this.data.frameCount / (time - this.data.startTime);
              let ft = this.frameSum/this.data.frameCount;
              console.log('1min', (time - this.data.startTime)/1000, this.data.frameCount,fps,'fps',ft,'ft');
          }
        }
      });
      

      AFRAME.registerComponent('multigltf', {
          init: function(){
            console.log('init',performance.now());
            const gltfAsset = document.getElementById('gltfID');
            const src = gltfAsset.getAttribute('src') || '';
            let name = src.split('/')[2];
            let scale;
            if(name==='Box'){
              scale=0.1;
            }else if(name==='BoxTextured4'){
              scale=0.1;
            }else if (name==='BoomBox'){
              scale=5;
            }else if(name==='DamagedHelmet'){
              scale=0.1;
            }else{
              scale=0.1;
            }

              let el = this.el;
              let sceneEl = document.querySelector('a-scene');
              el.addEventListener("model-loaded", e =>{    
                  let minx=-0.8, miny = -1.8, minz = -10;
                  let maxx=0.8,maxy=1.8,maxz=-3;
                  let edgeNum=16;
                  let LEVELS = 5;
                  const sourceModel = e.detail.model;
                  sourceModel.updateMatrixWorld(true);

                  LEVELS = Math.max(1, Math.floor(LEVELS));
                  const rootForModels = (LEVELS === 1) ? sceneEl : document.createElement('a-entity');
                  if (LEVELS !== 1) {
                    rootForModels.object3D.name = `SG_root_L${LEVELS}`;
                    sceneEl.appendChild(rootForModels);
                  }

                  const groupCache = new Map(); // pathKey -> a-entity

                  function getOrCreateLeafParent(i, j, k, edgeNum) {
                    if (LEVELS === 1) return rootForModels;

                    let x0 = 0, x1 = edgeNum - 1;
                    let y0 = 0, y1 = edgeNum - 1;
                    let z0 = 0, z1 = edgeNum - 1;

                    let parent = rootForModels;
                    let pathKey = '';

                    for (let level = 0; level < LEVELS - 1; level++) {
                      const mx = (x0 + x1) >> 1;
                      const my = (y0 + y1) >> 1;
                      const mz = (z0 + z1) >> 1;

                      const bx = (i > mx) ? 1 : 0;
                      const by = (j > my) ? 1 : 0;
                      const bz = (k > mz) ? 1 : 0;

                      const oct = (bx << 2) | (by << 1) | bz;
                      pathKey += (level === 0) ? String(oct) : `/${oct}`;

                      let grp = groupCache.get(pathKey);
                      if (!grp) {
                        grp = document.createElement('a-entity');
                        grp.object3D.name = `SG_L${level + 1}_O${oct}`;
                        groupCache.set(pathKey, grp);
                        parent.appendChild(grp);
                      }
                      parent = grp;

                      if (bx === 0) x1 = mx; else x0 = mx + 1;
                      if (by === 0) y1 = my; else y0 = my + 1;
                      if (bz === 0) z1 = mz; else z0 = mz + 1;
                    }

                    return parent;
                  }

                  for(let i=0;i<edgeNum;++i){
                    for(let j=0;j<edgeNum;++j){
                        for(let k=0;k<edgeNum;++k){
                            let curx = minx + (maxx-minx)/(edgeNum-1)*i;
                            let cury = miny+ (maxy-miny)/(edgeNum-1)*j;
                            let curz = minz + (maxz-minz)/(edgeNum-1)*k;
                            let entity = document.createElement('a-entity');
                            // Clone already-loaded glTF scene instead of reloading the asset per node.
                            entity.object3D.add(sourceModel.clone(true));
                            entity.setAttribute('position',String(curx)+' '+String(cury) + ' '+ String(curz));
                            entity.setAttribute('scale',String(scale)+' '+String(scale)+' '+String(scale));
                            const leafParent = getOrCreateLeafParent(i, j, k, edgeNum);
                            leafParent.appendChild(entity);
                        }
                    }
                  }
                  const sceneLoadedTimeAbsMs = performance.now() + performance.timeOrigin;
                  console.log('scene loaded time', sceneLoadedTimeAbsMs);
                  console.log('load duration', sceneLoadedTimeAbsMs - clickTimeAbsMs, 'ms');
                  loaded=true;

                }           
            );
          }
      });
    </script>
    <a-scene background="color: black" measure-fps>
      <a-assets>
        <a-asset-item id="gltfID" src='../gltf/Box/Box.gltf'></a-asset-item>
      </a-assets>
      <a-entity id="gltfmodel" visible="false" gltf-model="#gltfID"  multigltf></a-entity>

      <a-light type="ambient" color="#ffffff" intensity="0.45"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.8" position="2 5 4"></a-light>

      <a-entity camera look-controls wasd-controls position="0 0 0"></a-entity>
    </a-scene>
    
  </body>
</html>
