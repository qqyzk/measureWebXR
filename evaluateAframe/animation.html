<html>
<head>
  <title>Skeletal Animation - A-Frame</title>
  <script src="./src/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: monospace; }
    #info {
      position: absolute; top: 10px; left: 10px; color: #fff;
      background: rgba(0,0,0,0.55); padding: 8px; border-radius: 4px; line-height: 1.6;
    }
    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    button {
      padding: 6px 14px; font-size: 13px; cursor: pointer;
      border-radius: 4px; border: 1px solid #888; background: rgba(0,0,0,0.6); color: #fff;
    }
    button.active { background: rgba(80,160,255,0.7); }
  </style>
</head>
<body>
  <div id="info">
    Skeletal Animation (A-Frame + THREE.AnimationMixer)<br>
    <span id="status">Loading model...</span>
  </div>
  <div id="controls">
    <button id="btn-idle" class="active">Idle</button>
    <button id="btn-walk">Walk</button>
    <button id="btn-run">Run</button>
  </div>

  <script>
    let loaded = false;
    let frameCount = 0, startTime = null, shouldLog = true;

    AFRAME.registerComponent('measure-fps', {
      schema: {
        startFlag: { type: 'bool', default: true },
        frameCount: { type: 'int', default: 0 },
        startTime: { type: 'float', default: 0 },
        shouldLog: { type: 'bool', default: true }
      },
      init: function () {
        this.data.startFlag = true;
        this.data.frameCount = 0;
        this.data.shouldLog = true;
      },
      tock: function () {
        if (!loaded) return;
        let time = performance.now();
        if (this.data.startFlag) {
          this.data.startTime = time;
          this.data.startFlag = false;
          console.log('startTime', time + performance.timeOrigin);
        }
        this.data.frameCount += 1;
        if (this.data.frameCount % 300 === 0) {
          let fps = 1000 * this.data.frameCount / (time - this.data.startTime);
          console.log(this.data.frameCount, fps.toFixed(1), 'fps');
        }
        if ((time - this.data.startTime) / 1000 > 60 && this.data.shouldLog) {
          this.data.shouldLog = false;
          let fps = 1000 * this.data.frameCount / (time - this.data.startTime);
          console.log('1min', (time - this.data.startTime) / 1000, this.data.frameCount, fps.toFixed(1), 'fps');
        }
      }
    });

    AFRAME.registerComponent('anim-controller', {
      init: function () {
        this.mixer = null;
        this.clock = new THREE.Clock();
        this.actions = {};
        this.activeAction = null;
        this.clipNameMap = {};

        this.el.addEventListener('model-loaded', (e) => {
          const model = e.detail.model;
          if (!model || !model.animations || model.animations.length === 0) {
            document.getElementById('status').textContent = 'No animations found in model';
            loaded = true;
            return;
          }

          this.mixer = new THREE.AnimationMixer(model);
          model.animations.forEach(clip => {
            this.actions[clip.name] = this.mixer.clipAction(clip);
          });

          this.clipNameMap = {
            idle: this.resolveClipName('idle'),
            walk: this.resolveClipName('walk'),
            run: this.resolveClipName('run')
          };

          const names = Object.keys(this.actions);
          document.getElementById('status').textContent = 'Clips: ' + names.join(', ');
          console.log('Animation clips:', names);

          // Play first clip
          const firstKey = this.clipNameMap.idle || names[0];
          if (firstKey) {
            this.activeAction = this.actions[firstKey];
            this.activeAction.play();
          }

          loaded = true;
          console.log('scene loaded time', performance.now() + performance.timeOrigin);
        });

        this.el.addEventListener('model-error', () => {
          document.getElementById('status').textContent = 'Model load error (place Soldier.glb at ../gltf/Soldier/)';
          loaded = true;
        });
      },

      resolveClipName: function (keyword) {
        const names = Object.keys(this.actions);
        const lower = keyword.toLowerCase();
        const exact = names.find(n => n.toLowerCase() === lower);
        if (exact) return exact;
        const partial = names.find(n => n.toLowerCase().includes(lower));
        return partial || null;
      },

      switchAction: function (name) {
        const resolved = this.resolveClipName(name) || name;
        const next = this.actions[resolved];
        if (!next) { console.warn('No clip:', name); return; }
        if (this.activeAction && this.activeAction !== next) {
          this.activeAction.fadeOut(0.3);
        }
        next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(0.3).play();
        this.activeAction = next;
      },

      tick: function () {
        if (this.mixer) this.mixer.update(this.clock.getDelta());
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');

      function getController() {
        const entity = document.getElementById('soldier');
        return entity && entity.components['anim-controller'];
      }

      document.getElementById('btn-idle').onclick = () => {
        const ctrl = getController();
        if (ctrl) ctrl.switchAction('idle');
        document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-idle').classList.add('active');
      };
      document.getElementById('btn-walk').onclick = () => {
        const ctrl = getController();
        if (ctrl) ctrl.switchAction('walk');
        document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-walk').classList.add('active');
      };
      document.getElementById('btn-run').onclick = () => {
        const ctrl = getController();
        if (ctrl) ctrl.switchAction('run');
        document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-run').classList.add('active');
      };
    });
  </script>

  <a-scene measure-fps fog="type: linear; color: #334455; near: 10; far: 50">
    <a-assets>
      <a-asset-item id="soldierAsset" src="../gltf/Soldier/Soldier.glb"></a-asset-item>
    </a-assets>

    <!-- Ground -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#556677" shadow="receive: true"></a-plane>
    <a-grid></a-grid>

    <!-- Soldier model with animation controller -->
    <a-entity id="soldier" gltf-model="#soldierAsset" anim-controller shadow="cast: true"></a-entity>

    <!-- Lights -->
    <a-light type="hemisphere" color="#ffffff" groundColor="#444444" intensity="0.6" position="0 20 0"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="5 10 5" shadow="cast: true"></a-light>

    <a-entity camera look-controls position="1 2 5"></a-entity>
  </a-scene>
</body>
</html>
