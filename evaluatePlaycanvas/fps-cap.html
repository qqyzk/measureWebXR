<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FPS Cap Test - PlayCanvas</title>
    <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no' />
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
    <script src='./src/playcanvas-stable.min.js'></script>
</head>
<body>
    <canvas id='application'></canvas>
    <input  id="button" type="button" value="start" >
    <script>
        const params = new URLSearchParams(window.location.search);
        const fpsCap = Number(params.get('fpsCap') || '60');
        const targetInterval = 1000 / fpsCap;
        const N = 16; // 16^3 = 4096 models

        var btn = document.getElementById("button");
        btn.onclick = function conduct(){
            console.log('click time',performance.now());
            console.log('FPS cap:', fpsCap, 'interval:', targetInterval.toFixed(1), 'ms');
            let loaded = false;
        const canvas = document.getElementById('application');
        const app = new pc.Application(canvas);

        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
        app.setCanvasResolution(pc.RESOLUTION_AUTO);

        window.addEventListener('resize', () => app.resizeCanvas());
        let minx = -1.1, miny = -2.3, minz= -15;
        let maxx = 1.1, maxy=2.3, maxz=-3;
        let scale = 0.1;
        let edgeNum=N;
        let url='../gltf/Box/Box.gltf';

        app.assets.loadFromUrl(url, "container", function (err, asset) {
            const gltf= asset.resource.instantiateRenderEntity({
                castShadows: true,
            });
            for(let i=0;i<edgeNum;++i){
                for(let j=0;j<edgeNum;++j){
                    for(let k=0;k<edgeNum;++k){
                        let curx = minx + (maxx-minx)/(edgeNum-1)*i;
                        let cury = miny+ (maxy-miny)/(edgeNum-1)*j;
                        let curz = minz + (maxz-minz)/(edgeNum-1)*k;

                        const entity = gltf.clone();
                        entity.setPosition(curx,cury,curz);
                        entity.setLocalScale(scale,scale,scale);
                        app.root.addChild(entity);
                    }
                }
            }
            loaded=true;
            console.log('scene loaded time',performance.now());
        });

        const camera = new pc.Entity('camera');
        camera.addComponent('camera', {
            clearColor: new pc.Color(0.1, 0.1, 0.1)
        });
        app.root.addChild(camera);
        camera.setPosition(0, 0, 3);

        const light = new pc.Entity('light');
        light.addComponent('light');
        app.root.addChild(light);
        light.setEulerAngles(45, 0, 0);

        app.start();
        let startFlag = true;
        let frameCount = 0;
        let startTime = null;
        let shouldLog = true;
        let lastRenderTime = 0;
        app.on("update", function (dt) {
                let now = performance.now();
                // FPS cap: disable camera to skip rendering
                if (now - lastRenderTime < targetInterval) {
                    camera.enabled = false;
                    return;
                }
                camera.enabled = true;
                lastRenderTime = now;

                if(loaded){
                    if (startFlag) {
                        startTime = now;
                        startFlag = false;
                        console.log('startTime',startTime);
                    }
                    frameCount += 1;
                    if(frameCount % 1000 === 0) {
                        let fps = 1000 * frameCount / (now - startTime);
                        console.log(frameCount,fps,'fps');
                    }
                    if ((now - startTime) /1000 > 60 && shouldLog){
                        shouldLog = false;
                        let fps = 1000 * frameCount / (now - startTime);
                        console.log('1min', (now - startTime)/1000, frameCount,fps,'fps');
                    }
                }
        });

    }
    </script>
</body>
</html>
