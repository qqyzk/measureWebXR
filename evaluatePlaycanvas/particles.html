<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Particle Effects - PlayCanvas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; font-family: monospace; background: #000; }
    #info {
      position: absolute; top: 10px; left: 10px; color: #fff;
      background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px;
    }
    #controls {
      position: absolute; top: 10px; right: 10px; color: #fff;
      background: rgba(0,0,0,0.6); padding: 10px; border-radius: 4px;
    }
    label { display: block; margin: 4px 0; }
    input[type=range] { width: 160px; }
  </style>
  <script src="./src/playcanvas-stable.min.js"></script>
</head>
<body>
  <div id="info">Particle Effects (PlayCanvas)<br><span id="count-display"></span></div>
  <div id="controls">
    <label>Mode:
      <select id="mode-select">
        <option value="smoke">Smoke</option>
        <option value="fire">Fire</option>
      </select>
    </label>
    <label>Particle Count: <span id="slider-val">5000</span>
      <input type="range" id="particle-count" min="100" max="50000" step="100" value="5000">
    </label>
    <button id="btn-start">Start</button>
  </div>
  <canvas id="application"></canvas>

  <script>
    let PARTICLE_COUNT = 5000;
    let particleEntity = null;
    let app;
    let frameCount = 0, startTime = null, shouldLog = true;

    document.getElementById('particle-count').addEventListener('input', (e) => {
      PARTICLE_COUNT = parseInt(e.target.value);
      document.getElementById('slider-val').textContent = PARTICLE_COUNT;
    });

    // Create a radial gradient canvas texture for particles
    function makeParticleTexture(graphicsDevice) {
      const sz = 64;
      const cvs = document.createElement('canvas');
      cvs.width = sz; cvs.height = sz;
      const ctx = cvs.getContext('2d');
      const grad = ctx.createRadialGradient(sz/2, sz/2, 0, sz/2, sz/2, sz/2);
      grad.addColorStop(0,   'rgba(255,255,255,1)');
      grad.addColorStop(0.4, 'rgba(255,255,255,0.8)');
      grad.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, sz, sz);

      const tex = new pc.Texture(graphicsDevice, { width: sz, height: sz, format: pc.PIXELFORMAT_R8_G8_B8_A8, mipmaps: false });
      tex.setSource(cvs);
      return tex;
    }

    function createParticleSystem(mode, count) {
      if (particleEntity) { particleEntity.destroy(); particleEntity = null; }

      const tex = makeParticleTexture(app.graphicsDevice);

      particleEntity = new pc.Entity('particles');

      // Color curves (R, G, B over lifetime 0..1)
      let colorGraph;
      if (mode === 'fire') {
        colorGraph = new pc.CurveSet([
          [0, 1.0, 1, 1.0],   // R stays high
          [0, 0.5, 0.5, 0.2, 1, 0.0], // G fades
          [0, 0.0, 1, 0.0]    // B zero
        ]);
      } else {
        colorGraph = new pc.CurveSet([
          [0, 0.4, 1, 0.7], // R
          [0, 0.4, 1, 0.7], // G
          [0, 0.4, 1, 0.7]  // B
        ]);
      }

      const alphaGraph = new pc.Curve([0, 0, 0.08, 0.95, 0.7, 0.45, 1, 0]);
      const scaleGraph = new pc.Curve([0, 0.025, 0.45, 0.12, 1, 0.2]);

      const velocityGraph = new pc.CurveSet([
        [0, -2.4, 1, 2.4],
        [0,  1.2, 1, 3.4],
        [0, -2.4, 1, 2.4]
      ]);
      const velocityGraph2 = new pc.CurveSet([
        [0, -4.2, 1, 4.2],
        [0,  2.0, 1, 5.2],
        [0, -4.2, 1, 4.2]
      ]);

      particleEntity.addComponent('particlesystem', {
        numParticles: count,
        lifetime:     mode === 'fire' ? 1.0 : 1.6,
        rate:         mode === 'fire' ? 0.001 : 0.0015,
        rate2:        mode === 'fire' ? 0.0015 : 0.002,
        emitterShape: pc.EMITTERSHAPE_SPHERE,
        emitterRadius: mode === 'fire' ? 0.2 : 0.35,
        localSpace: false,
        initialVelocity:  mode === 'fire' ? 3.6 : 2.6,
        velocityGraph: velocityGraph,
        velocityGraph2: velocityGraph2,
        colorGraph:  colorGraph,
        alphaGraph:  alphaGraph,
        scaleGraph: scaleGraph,
        scaleGraph2: scaleGraph,
        colorMap:    tex,
        blendType:   mode === 'fire' ? pc.BLEND_ADDITIVEALPHA : pc.BLEND_NORMAL,
        loop:        true,
        depthSoftening: 0
      });

      app.root.addChild(particleEntity);
      document.getElementById('count-display').textContent = 'Particles: ' + count + '  Mode: ' + mode;
      frameCount = 0; startTime = null; shouldLog = true;
    }

    document.getElementById('btn-start').addEventListener('click', () => {
      const mode = document.getElementById('mode-select').value;

      if (!app) {
        const canvas = document.getElementById('application');
        app = new pc.Application(canvas);
        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
        app.setCanvasResolution(pc.RESOLUTION_AUTO);
        window.addEventListener('resize', () => app.resizeCanvas());

        // Camera
        const camera = new pc.Entity('camera');
        camera.addComponent('camera', { clearColor: new pc.Color(0, 0, 0) });
        camera.setPosition(0, 3, 14);
        camera.lookAt(new pc.Vec3(0, 2, 0));
        app.root.addChild(camera);

        // Ambient only
        app.scene.ambientLight = new pc.Color(0.2, 0.2, 0.2);
        app.start();

        app.on('update', function () {
          if (!particleEntity) return;
          const time = performance.now();
          if (startTime === null) startTime = time;
          frameCount++;
          if (frameCount % 300 === 0) {
            const fps = 1000 * frameCount / (time - startTime);
            console.log('frame', frameCount, 'fps:', fps.toFixed(1), 'particles:', PARTICLE_COUNT);
          }
          if ((time - startTime) / 1000 > 60 && shouldLog) {
            shouldLog = false;
            const fps = 1000 * frameCount / (time - startTime);
            console.log('1min result', fps.toFixed(1), 'fps  particles:', PARTICLE_COUNT);
          }
        });
      }

      createParticleSystem(mode, PARTICLE_COUNT);
    });
  </script>
</body>
</html>
