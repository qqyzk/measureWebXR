<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>My first babylon.js app</title>
		<style>
			body { margin: 0; }
		</style>
        <script src="./src/babylon.js"></script>
        <script src="./src/babylon.glTFFileLoader.js"></script>
	</head>
	<body>
        <canvas id="renderCanvas"></canvas>
        <input  id="button" type="button" value="start" > 
		<script>
            var btn = document.getElementById("button");  
            btn.onclick = function conduct(){
                console.log('click time',performance.now());
                    let loaded=false;
            let name='BoxTextured';
            let type='gltf';
            let N=16; 
            let LEVELS = 4;
            // get the canvas DOM element
            var canvas = document.getElementById('renderCanvas');
            canvas.width=window.innerWidth;
            canvas.height=window.innerHeight;
            // Load the 3D engine
            var engine = new BABYLON.Engine(canvas, {antialias:true,adaptToDeviceRatio:true});
            // CreateScene function that creates and return the scene
            var createScene = function(){
                // Create a basic BJS Scene object
                var scene = new BABYLON.Scene(engine);
                scene.createDefaultCameraOrLight(true, true, true);
                scene.activeCamera.alpha += Math.PI;
                scene.clearColor = new BABYLON.Color3(0, 0, 0);
                let minx=-0.5, miny=-1.1, minz=-10;
                let maxx=0.5, maxy=1.1, maxz = -2;
                let edgeNum=N;
                let scale;
                let url;
                if(name==='Box' && type==='gltf'){
                    url='../gltf/Box/Box.gltf';
                    scale=0.05;
                }else if(name==='Box' && type==='glb'){
                    url='../gltf/Box/Box.glb';
                    scale=0.05;
                }else if(name==='BoxTextured' && type==='gltf'){
                    url='../gltf/BoxTextured4/BoxTextured.gltf';
                    scale=0.05;
                }else if(name==='BoxTextured' && type==='glb'){
                    url='../gltf/BoxTextured/BoxTextured.glb';
                    scale=0.05;
                }else if(name==='BoomBox' && type==='gltf'){
                    url='../gltf/BoomBox/BoomBox.gltf';
                    scale=5;
                }else if(name==='BoomBox' && type==='glb'){
                    url='../gltf/BoomBox/BoomBox.glb';
                    scale=5;
                }else if(name==='DamagedHelmet' && type==='gltf'){
                    url='../gltf/DamagedHelmet/DamagedHelmet.gltf';
                    scale=0.05;
                }else if(name==='DamagedHelmet' && type==='glb'){
                    url='../gltf/DamagedHelmet/DamagedHelmet.glb';
                    scale=0.05;
                }

                // Build a shared multi-level scene graph (octree-style partition on i/j/k).
                // All intermediate nodes are TransformNode with identity transform; leaves are mesh clones.
                LEVELS = Math.max(1, Math.floor(LEVELS));
                const rootForModels = (LEVELS === 1) ? null : new BABYLON.TransformNode(`SG_root_L${LEVELS}`, scene);
                const groupCache = new Map(); // pathKey -> TransformNode

                function getOrCreateLeafParent(i, j, k, edgeNum) {
                    if (LEVELS === 1) return null;

                    let x0 = 0, x1 = edgeNum - 1;
                    let y0 = 0, y1 = edgeNum - 1;
                    let z0 = 0, z1 = edgeNum - 1;

                    let parent = rootForModels;
                    let pathKey = '';

                    for (let level = 0; level < LEVELS - 1; level++) {
                        const mx = (x0 + x1) >> 1;
                        const my = (y0 + y1) >> 1;
                        const mz = (z0 + z1) >> 1;

                        const bx = (i > mx) ? 1 : 0;
                        const by = (j > my) ? 1 : 0;
                        const bz = (k > mz) ? 1 : 0;

                        const oct = (bx << 2) | (by << 1) | bz;
                        pathKey += (level === 0) ? String(oct) : `/${oct}`;

                        let grp = groupCache.get(pathKey);
                        if (!grp) {
                            grp = new BABYLON.TransformNode(`SG_L${level + 1}_O${oct}`, scene);
                            groupCache.set(pathKey, grp);
                            grp.parent = parent;
                        }
                        parent = grp;

                        if (bx === 0) x1 = mx; else x0 = mx + 1;
                        if (by === 0) y1 = my; else y0 = my + 1;
                        if (bz === 0) z1 = mz; else z0 = mz + 1;
                    }

                    return parent;
                }

                BABYLON.SceneLoader.LoadAssetContainer(url,"",scene,
                    (assets) => { 
                    for(let i=0;i<edgeNum;++i){
                        for(let j=0;j<edgeNum;++j){
                            for(let k=0;k<edgeNum;++k){   
                                let curx = minx + (maxx-minx)/(edgeNum-1)*i;
                                let cury = miny+ (maxy-miny)/(edgeNum-1)*j;
                                let curz = minz + (maxz-minz)/(edgeNum-1)*k;
                                const leafParent = getOrCreateLeafParent(i, j, k, edgeNum);

                                let mesh;
                                if(i==0 && k ==0 && j == 0){
                                    mesh = assets.meshes[0];
                                } else{
                                    mesh = assets.meshes[0].clone();
                                    assets.meshes.push(mesh);
                                }
                                mesh.scaling = new BABYLON.Vector3(scale,scale,-1*scale);
                                mesh.position = new BABYLON.Vector3(curx,cury,curz);
                                mesh.parent = leafParent;
                            }
                        }
                    }   
                    assets.addAllToScene();
                    loaded=true;
                    console.log('scene loaded time',performance.now());
                    
                });
                    
        
                return scene;
            }
            // call the createScene function
            var scene = createScene();
            let startFlag = true;
            let frameCount = 0;
            let startTime = null;
            let shouldLog = true;
            // run the render loop
            // Register and execute a render loop. The engine can have more than one render function
            engine.runRenderLoop(function(){
                // Render the scene
                scene.render();
                // console.log('hi');
                if (loaded){
                    
                    let time = performance.now();
                    if (startFlag) {
                        startTime = time;
                        startFlag = false;
                        console.log('startTime',startTime);
                    }
                    frameCount += 1;
                    if(frameCount % 1000 === 0) {
                        let fps = 1000 * frameCount / (time - startTime);
                        console.log(frameCount,fps,'fps');
                    } 
                    if ((time - startTime) /1000 > 60 && shouldLog){
                        shouldLog = false;
                        let fps = 1000 * frameCount / (time - startTime);
                        console.log('1min', (time - startTime)/1000, frameCount,fps,'fps');
                    }
                }
            });
            // the canvas/window resize event handler
            window.addEventListener('resize', function(){
                engine.resize();
               
            });
        }
		</script>
	</body>
</html>
