<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Sustained Workload Test - Babylon.js</title>
		<style>
			body { margin: 0; }
		</style>
        <script src="./src/babylon.js"></script>
        <script src="./src/babylon.glTFFileLoader.js"></script>
	</head>
	<body>
        <canvas id="renderCanvas"></canvas>
        <input  id="button" type="button" value="start" >
		<script>
            var btn = document.getElementById("button");
            btn.onclick = function conduct(){
                console.log('click time',performance.now());
                let loaded = false;
            let name = 'Box';
            let type = 'gltf';
            let N = 16;
            let DURATION = 600;
            let WINDOW = 10;

            var canvas = document.getElementById('renderCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            var engine = new BABYLON.Engine(canvas, {antialias:true, adaptToDeviceRatio:true});
            var createScene = function(){
                var scene = new BABYLON.Scene(engine);
                scene.createDefaultCameraOrLight(true, true, true);
                scene.activeCamera.alpha += Math.PI;
                scene.clearColor = new BABYLON.Color3(0, 0, 0);
                let minx=-0.5, miny=-1.1, minz=-10;
                let maxx=0.5, maxy=1.1, maxz = -2;
                let edgeNum = N;
                let url, scale;
                if(name==='Box' && type==='gltf'){
                    url='../gltf/Box/Box.gltf';
                    scale=0.05;
                }else if(name==='BoxTextured' && type==='gltf'){
                    url='../gltf/BoxTextured4/BoxTextured.gltf';
                    scale=0.05;
                }
                BABYLON.SceneLoader.LoadAssetContainer(url,"",scene,
                    (assets) => {
                    for(let i=0;i<edgeNum;++i){
                        for(let j=0;j<edgeNum;++j){
                            for(let k=0;k<edgeNum;++k){
                                let curx = minx + (maxx-minx)/(edgeNum-1)*i;
                                let cury = miny+ (maxy-miny)/(edgeNum-1)*j;
                                let curz = minz + (maxz-minz)/(edgeNum-1)*k;
                                if(i==0 && k ==0 && j == 0){
                                    assets.meshes[0].scaling = new BABYLON.Vector3(scale,scale,-1*scale);
                                    assets.meshes[0].position = new BABYLON.Vector3(curx,cury,curz);
                                } else{
                                    let mesh = assets.meshes[0].clone();
                                    mesh.scaling = new BABYLON.Vector3(scale,scale,-1*scale);
                                    mesh.position = new BABYLON.Vector3(curx,cury,curz);
                                    assets.meshes.push(mesh);
                                }
                            }
                        }
                    }
                    assets.addAllToScene();
                    loaded = true;
                    console.log('scene loaded time',performance.now());
                });
                return scene;
            }
            var scene = createScene();

            let startFlag = true;
            let startTime = null;
            let windowFrameSum = 0;
            let windowFrameCount = 0;
            let windowStartTime = null;
            let results = [];
            let finished = false;

            engine.runRenderLoop(function(){
                let frameStart = performance.now();
                scene.render();
                let frameEnd = performance.now();

                if (loaded && !finished){
                    let time = performance.now();
                    let frametime = frameEnd - frameStart;

                    if (startFlag) {
                        startTime = time;
                        windowStartTime = time;
                        startFlag = false;
                        console.log('startTime', startTime);
                    }

                    windowFrameSum += frametime;
                    windowFrameCount += 1;

                    let elapsed = (time - startTime) / 1000;
                    let windowElapsed = (time - windowStartTime) / 1000;

                    if (windowElapsed >= WINDOW) {
                        let avgFt = windowFrameSum / windowFrameCount;
                        let windowFps = 1000 * windowFrameCount / (time - windowStartTime);
                        let entry = {t: Math.round(elapsed), ft: parseFloat(avgFt.toFixed(2)), fps: parseFloat(windowFps.toFixed(1)), frames: windowFrameCount};
                        results.push(entry);
                        console.log('window', entry.t + 's', 'ft=' + entry.ft + 'ms', 'fps=' + entry.fps, 'frames=' + entry.frames);

                        windowFrameSum = 0;
                        windowFrameCount = 0;
                        windowStartTime = time;
                    }

                    if (elapsed >= DURATION) {
                        finished = true;
                        console.log('=== RESULTS ===');
                        console.log(JSON.stringify(results));
                        console.log('=== END ===');
                    }
                }
            });
            window.addEventListener('resize', function(){
                engine.resize();
            });
        }
		</script>
	</body>
</html>
