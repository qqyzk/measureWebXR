<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Particle Effects - Babylon.js</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: monospace; background: #000; }
    canvas { width: 100%; height: 100%; }
    #info {
      position: absolute; top: 10px; left: 10px; color: #fff;
      background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px;
    }
    #controls {
      position: absolute; top: 10px; right: 10px; color: #fff;
      background: rgba(0,0,0,0.6); padding: 10px; border-radius: 4px;
    }
    label { display: block; margin: 4px 0; }
    input[type=range] { width: 160px; }
  </style>
  <script src="./src/babylon.js"></script>
</head>
<body>
  <div id="info">Particle Effects (Babylon.js)<br><span id="count-display"></span></div>
  <div id="controls">
    <label>Mode:
      <select id="mode-select">
        <option value="smoke">Smoke</option>
        <option value="fire">Fire</option>
      </select>
    </label>
    <label>Particle Count: <span id="slider-val">5000</span>
      <input type="range" id="particle-count" min="100" max="50000" step="100" value="5000">
    </label>
    <button id="btn-start">Start</button>
  </div>
  <canvas id="renderCanvas"></canvas>

  <script>
    let PARTICLE_COUNT = 5000;
    let particleSystem = null;
    let engine, scene;
    let frameCount = 0, startTime = null, shouldLog = true;

    document.getElementById('particle-count').addEventListener('input', (e) => {
      PARTICLE_COUNT = parseInt(e.target.value);
      document.getElementById('slider-val').textContent = PARTICLE_COUNT;
    });

    // Build a small white-circle texture via DynamicTexture
    function makeParticleTexture(scene) {
      const tex = new BABYLON.DynamicTexture('ptex', { width: 64, height: 64 }, scene);
      const ctx = tex.getContext();
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0,   'rgba(255,255,255,1)');
      grad.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      tex.update();
      return tex;
    }

    function createParticleSystem(mode, count) {
      if (particleSystem) { particleSystem.dispose(); particleSystem = null; }

      const pSystem = new BABYLON.ParticleSystem('particles', count, scene);
      pSystem.particleTexture = makeParticleTexture(scene);
      pSystem.emitter = new BABYLON.Vector3(0, 0, 0);

      // Emission
      pSystem.minEmitBox = new BABYLON.Vector3(-0.5, 0, -0.5);
      pSystem.maxEmitBox = new BABYLON.Vector3(0.5,  0,  0.5);
      pSystem.minLifeTime = 1.0;
      pSystem.maxLifeTime = 2.0;
      pSystem.emitRate = count / 1.5;
      pSystem.minSize = 0.1; pSystem.maxSize = 0.35;
      pSystem.minEmitPower = 0.5; pSystem.maxEmitPower = 1.5;
      pSystem.direction1 = new BABYLON.Vector3(-0.3, 1, -0.3);
      pSystem.direction2 = new BABYLON.Vector3(0.3,  2,  0.3);
      pSystem.gravity    = new BABYLON.Vector3(0, 0, 0);
      pSystem.updateSpeed = 0.016;

      if (mode === 'fire') {
        pSystem.color1 = new BABYLON.Color4(1.0, 0.5, 0.0, 1.0);
        pSystem.color2 = new BABYLON.Color4(1.0, 0.2, 0.0, 1.0);
        pSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0);
        pSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
      } else {
        pSystem.color1 = new BABYLON.Color4(0.7, 0.7, 0.7, 0.6);
        pSystem.color2 = new BABYLON.Color4(0.5, 0.5, 0.5, 0.4);
        pSystem.colorDead = new BABYLON.Color4(0.3, 0.3, 0.3, 0);
        pSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
      }

      pSystem.start();
      particleSystem = pSystem;
      document.getElementById('count-display').textContent = 'Particles: ' + count + '  Mode: ' + mode;
      frameCount = 0; startTime = null; shouldLog = true;
    }

    document.getElementById('btn-start').addEventListener('click', () => {
      const mode = document.getElementById('mode-select').value;
      if (!engine) {
        const canvas = document.getElementById('renderCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        engine = new BABYLON.Engine(canvas, { antialias: true, adaptToDeviceRatio: true });
        scene  = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);

        const camera = new BABYLON.ArcRotateCamera('cam', -Math.PI / 2, Math.PI / 4, 22, new BABYLON.Vector3(0, 5, 0), scene);
        camera.attachControl(canvas, true);
        new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene).intensity = 0.3;

        engine.runRenderLoop(() => {
          scene.render();
          const time = performance.now();
          if (particleSystem) {
            if (startTime === null) startTime = time;
            frameCount++;
            if (frameCount % 300 === 0) {
              const fps = 1000 * frameCount / (time - startTime);
              console.log('frame', frameCount, 'fps:', fps.toFixed(1), 'particles:', PARTICLE_COUNT);
            }
            if ((time - startTime) / 1000 > 60 && shouldLog) {
              shouldLog = false;
              const fps = 1000 * frameCount / (time - startTime);
              console.log('1min result', fps.toFixed(1), 'fps  particles:', PARTICLE_COUNT);
            }
          }
        });
        window.addEventListener('resize', () => engine.resize());
      }
      createParticleSystem(mode, PARTICLE_COUNT);
    });
  </script>
</body>
</html>
