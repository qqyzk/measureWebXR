<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Raw WebGL 2.0 Cube Benchmark</title>
    <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no' />
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <input id="button" type="button" value="start">
    <script>
    const params = new URLSearchParams(window.location.search);
    const N = Number(params.get('n') || '4096');
    const DURATION = 60;

    const edgeNum = Math.ceil(Math.cbrt(N));
    const actualN = edgeNum * edgeNum * edgeNum;

    // Scene bounds (matching existing experiments)
    const minx = -1.1, maxx = 1.1;
    const miny = -2.3, maxy = 2.3;
    const minz = -15, maxz = -3;
    const scale = 0.1;

    // Camera
    const cameraPos = [0, 0, 3];
    const cameraTarget = [0, 0, -9];
    const cameraUp = [0, 1, 0];
    const fov = 45 * Math.PI / 180;
    const near = 0.1, far = 100;

    // ===== Shader source (GLSL ES 300) — identical to Android side =====
    const vsSource = `#version 300 es
layout(location = 0) in vec3 aPosition;
layout(location = 1) in vec3 aNormal;

uniform mat4 uProjection;
uniform mat4 uView;
uniform float uScale;
uniform vec3 uOffset;

out vec3 vNormal;

void main() {
    vec3 worldPos = aPosition * uScale + uOffset;
    vNormal = aNormal;
    gl_Position = uProjection * uView * vec4(worldPos, 1.0);
}`;

    const fsSource = `#version 300 es
precision mediump float;

in vec3 vNormal;
out vec4 fragColor;

const vec3 uLightDir = vec3(0.5774, 0.5774, 0.5774);
const vec3 uColor = vec3(0.8, 0.4, 0.2);
const float uAmbient = 0.3;

void main() {
    float diff = max(dot(normalize(vNormal), uLightDir), 0.0);
    vec3 color = uColor * (uAmbient + (1.0 - uAmbient) * diff);
    fragColor = vec4(color, 1.0);
}`;

    // ===== Matrix utilities (identical math to Android side) =====
    function perspective(fov, aspect, near, far) {
        const f = 1.0 / Math.tan(fov / 2);
        const nf = 1.0 / (near - far);
        // column-major
        return new Float32Array([
            f / aspect, 0, 0, 0,
            0, f, 0, 0,
            0, 0, (far + near) * nf, -1,
            0, 0, 2 * far * near * nf, 0
        ]);
    }

    function lookAt(eye, center, up) {
        let fx = center[0]-eye[0], fy = center[1]-eye[1], fz = center[2]-eye[2];
        let len = Math.sqrt(fx*fx + fy*fy + fz*fz);
        fx /= len; fy /= len; fz /= len;
        let sx = fy*up[2]-fz*up[1], sy = fz*up[0]-fx*up[2], sz = fx*up[1]-fy*up[0];
        len = Math.sqrt(sx*sx + sy*sy + sz*sz);
        sx /= len; sy /= len; sz /= len;
        let ux = sy*fz-sz*fy, uy = sz*fx-sx*fz, uz = sx*fy-sy*fx;
        // column-major
        return new Float32Array([
            sx, ux, -fx, 0,
            sy, uy, -fy, 0,
            sz, uz, -fz, 0,
            -(sx*eye[0]+sy*eye[1]+sz*eye[2]),
            -(ux*eye[0]+uy*eye[1]+uz*eye[2]),
            (fx*eye[0]+fy*eye[1]+fz*eye[2]),
            1
        ]);
    }

    // ===== Cube geometry (36 vertices, position + normal) =====
    function createCubeVertices() {
        const p = 0.5;
        return new Float32Array([
            // Front (z=+p), normal (0,0,1)
            -p,-p, p, 0,0,1,  p,-p, p, 0,0,1,  p, p, p, 0,0,1,
            -p,-p, p, 0,0,1,  p, p, p, 0,0,1, -p, p, p, 0,0,1,
            // Back (z=-p), normal (0,0,-1)
             p,-p,-p, 0,0,-1, -p,-p,-p, 0,0,-1, -p, p,-p, 0,0,-1,
             p,-p,-p, 0,0,-1, -p, p,-p, 0,0,-1,  p, p,-p, 0,0,-1,
            // Right (x=+p), normal (1,0,0)
             p,-p, p, 1,0,0,  p,-p,-p, 1,0,0,  p, p,-p, 1,0,0,
             p,-p, p, 1,0,0,  p, p,-p, 1,0,0,  p, p, p, 1,0,0,
            // Left (x=-p), normal (-1,0,0)
            -p,-p,-p,-1,0,0, -p,-p, p,-1,0,0, -p, p, p,-1,0,0,
            -p,-p,-p,-1,0,0, -p, p, p,-1,0,0, -p, p,-p,-1,0,0,
            // Top (y=+p), normal (0,1,0)
            -p, p, p, 0,1,0,  p, p, p, 0,1,0,  p, p,-p, 0,1,0,
            -p, p, p, 0,1,0,  p, p,-p, 0,1,0, -p, p,-p, 0,1,0,
            // Bottom (y=-p), normal (0,-1,0)
            -p,-p,-p, 0,-1,0, p,-p,-p, 0,-1,0,  p,-p, p, 0,-1,0,
            -p,-p,-p, 0,-1,0, p,-p, p, 0,-1,0, -p,-p, p, 0,-1,0,
        ]);
    }

    // ===== Precompute offsets array =====
    function createOffsets() {
        const offsets = [];
        for (let i = 0; i < edgeNum; i++) {
            for (let j = 0; j < edgeNum; j++) {
                for (let k = 0; k < edgeNum; k++) {
                    offsets.push(
                        minx + (maxx - minx) / (edgeNum - 1) * i,
                        miny + (maxy - miny) / (edgeNum - 1) * j,
                        minz + (maxz - minz) / (edgeNum - 1) * k
                    );
                }
            }
        }
        return offsets;
    }

    // ===== Main =====
    var btn = document.getElementById('button');
    btn.onclick = function() {
        console.log('click time', performance.now());
        console.log('N:', actualN, 'edgeNum:', edgeNum);

        const canvas = document.getElementById('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const gl = canvas.getContext('webgl2');
        if (!gl) { alert('WebGL 2.0 not supported'); return; }

        // Compile shaders
        function compileShader(src, type) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(s));
                return null;
            }
            return s;
        }
        const vs = compileShader(vsSource, gl.VERTEX_SHADER);
        const fs = compileShader(fsSource, gl.FRAGMENT_SHADER);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error(gl.getProgramInfoLog(program));
            return;
        }
        gl.useProgram(program);

        // Uniforms
        const uProjection = gl.getUniformLocation(program, 'uProjection');
        const uView = gl.getUniformLocation(program, 'uView');
        const uScale = gl.getUniformLocation(program, 'uScale');
        const uOffset = gl.getUniformLocation(program, 'uOffset');

        const aspect = canvas.width / canvas.height;
        gl.uniformMatrix4fv(uProjection, false, perspective(fov, aspect, near, far));
        gl.uniformMatrix4fv(uView, false, lookAt(cameraPos, cameraTarget, cameraUp));
        gl.uniform1f(uScale, scale);

        // VAO
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        // Cube VBO (position + normal, stride=24, offset 0 and 12)
        const cubeVBO = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, cubeVBO);
        gl.bufferData(gl.ARRAY_BUFFER, createCubeVertices(), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);

        // GL state
        gl.enable(gl.DEPTH_TEST);
        gl.enable(gl.CULL_FACE);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.viewport(0, 0, canvas.width, canvas.height);

        // Precompute offsets
        const offsets = createOffsets();

        // Render loop: per-object draw call (N calls per frame)
        let frameCount = 0;
        let startTime = null;
        let shouldLog = true;
        let totalFT = 0;

        function render() {
            const now = performance.now();
            if (startTime === null) {
                startTime = now;
                console.log('render start', startTime);
            }

            // --- Frame Time measurement start ---
            const t0 = performance.now();
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            for (let i = 0; i < actualN; i++) {
                gl.uniform3f(uOffset, offsets[i*3], offsets[i*3+1], offsets[i*3+2]);
                gl.drawArrays(gl.TRIANGLES, 0, 36);
            }
            const ft = performance.now() - t0;
            totalFT += ft;
            // --- Frame Time measurement end ---

            frameCount++;
            if (frameCount % 1000 === 0) {
                const fps = 1000 * frameCount / (now - startTime);
                const avgFT = totalFT / frameCount;
                console.log(frameCount, fps.toFixed(1), 'fps', avgFT.toFixed(3), 'ms/frame');
            }
            if ((now - startTime) / 1000 > DURATION && shouldLog) {
                shouldLog = false;
                const fps = 1000 * frameCount / (now - startTime);
                const avgFT = totalFT / frameCount;
                console.log('done', ((now - startTime) / 1000).toFixed(1), frameCount, fps.toFixed(1), 'fps', avgFT.toFixed(3), 'ms/frame');
            }

            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    };
    </script>
</body>
</html>
