<!DOCTYPE html>
<html lang="en">

<head>
    <title>Particle Effects - Three.js</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #fff;
            font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.5);
            padding: 8px; border-radius: 4px;
        }
        #controls {
            position: absolute; top: 10px; right: 10px; color: #fff;
            font-family: monospace; font-size: 13px; background: rgba(0,0,0,0.6);
            padding: 10px; border-radius: 4px;
        }
        label { display: block; margin: 4px 0; }
        input[type=range] { width: 160px; }
    </style>
</head>

<body>
    <div id="info">Particle Effects<br><span id="count-display"></span></div>
    <div id="controls">
        <label>Mode:
            <select id="mode-select">
                <option value="smoke">Smoke</option>
                <option value="fire">Fire</option>
            </select>
        </label>
        <label>Particle Count: <span id="slider-val">5000</span>
            <input type="range" id="particle-count" min="100" max="50000" step="100" value="5000">
        </label>
        <button id="btn-start">Start</button>
    </div>

    <script type="module">
        import * as THREE from './src/three.module.js';

        let camera, scene, renderer;
        let particleSystem, particles;
        let frameCount = 0, startTime = null, shouldLog = true;
        let stats_display = document.getElementById('count-display');

        // ── Key variable: particle count ──────────────────────────
        let PARTICLE_COUNT = 5000;

        const slider = document.getElementById('particle-count');
        const sliderVal = document.getElementById('slider-val');
        const modeSelect = document.getElementById('mode-select');

        slider.addEventListener('input', () => {
            PARTICLE_COUNT = parseInt(slider.value);
            sliderVal.textContent = PARTICLE_COUNT;
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            if (renderer) {
                // Rebuild particle system with new count/mode
                if (particleSystem) scene.remove(particleSystem);
                createParticleSystem(modeSelect.value);
                frameCount = 0; startTime = null; shouldLog = true;
            } else {
                init();
                animate();
            }
        });

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 20);
            camera.lookAt(0, 5, 0);

            // Ambient light for visibility
            scene.add(new THREE.AmbientLight(0x404040));

            createParticleSystem(modeSelect.value);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createParticleSystem(mode) {
            const count = PARTICLE_COUNT;
            const positions = new Float32Array(count * 3);
            const colors    = new Float32Array(count * 3);
            const sizes     = new Float32Array(count);
            const velocities = [];   // kept in JS for animation
            const lifetimes  = [];

            for (let i = 0; i < count; i++) {
                // Spawn in a small cone at origin
                positions[i * 3]     = (Math.random() - 0.5) * 1.0;
                positions[i * 3 + 1] = 0;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 1.0;

                velocities.push(
                    (Math.random() - 0.5) * 0.03,
                    Math.random() * 0.08 + 0.02,
                    (Math.random() - 0.5) * 0.03
                );

                lifetimes.push(Math.random()); // 0‥1 phase offset

                sizes[i] = Math.random() * 8 + 2;

                if (mode === 'fire') {
                    // Fire: red → orange → yellow
                    colors[i * 3]     = 1.0;
                    colors[i * 3 + 1] = Math.random() * 0.5;
                    colors[i * 3 + 2] = 0.0;
                } else {
                    // Smoke: dark grey
                    const v = Math.random() * 0.4 + 0.3;
                    colors[i * 3] = v; colors[i * 3 + 1] = v; colors[i * 3 + 2] = v;
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color',    new THREE.BufferAttribute(colors,    3));
            geo.setAttribute('size',     new THREE.BufferAttribute(sizes,     1));

            const mat = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                transparent: true,
                opacity: mode === 'fire' ? 0.85 : 0.45,
                depthWrite: false,
                blending: mode === 'fire' ? THREE.AdditiveBlending : THREE.NormalBlending,
                sizeAttenuation: true
            });

            particleSystem = new THREE.Points(geo, mat);
            particleSystem.userData = { velocities, lifetimes, mode, count };
            scene.add(particleSystem);

            stats_display.textContent = `Particles: ${count}  Mode: ${mode}`;
        }

        function updateParticles(delta) {
            if (!particleSystem) return;
            const { velocities, lifetimes, mode, count } = particleSystem.userData;
            const pos = particleSystem.geometry.attributes.position;
            const col = particleSystem.geometry.attributes.color;

            for (let i = 0; i < count; i++) {
                lifetimes[i] += delta * 0.5;
                if (lifetimes[i] > 1.0) {
                    // Reset particle
                    lifetimes[i] = 0;
                    pos.array[i * 3]     = (Math.random() - 0.5) * 1.0;
                    pos.array[i * 3 + 1] = 0;
                    pos.array[i * 3 + 2] = (Math.random() - 0.5) * 1.0;
                    velocities[i * 3]     = (Math.random() - 0.5) * 0.03;
                    velocities[i * 3 + 1] = Math.random() * 0.08 + 0.02;
                    velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.03;
                } else {
                    pos.array[i * 3]     += velocities[i * 3];
                    pos.array[i * 3 + 1] += velocities[i * 3 + 1];
                    pos.array[i * 3 + 2] += velocities[i * 3 + 2];

                    // Colour fade: fire dims to black; smoke lightens
                    const age = lifetimes[i];
                    if (mode === 'fire') {
                        col.array[i * 3 + 1] = Math.max(0, (0.5 - age) * 1.0); // green channel fades
                    } else {
                        const v = 0.3 + age * 0.4;
                        col.array[i * 3] = v; col.array[i * 3 + 1] = v; col.array[i * 3 + 2] = v;
                    }
                }
            }
            pos.needsUpdate = true;
            col.needsUpdate = true;
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            updateParticles(delta);
            renderer.render(scene, camera);

            // FPS logging
            const now = performance.now();
            if (startTime === null) startTime = now;
            frameCount++;
            if (frameCount % 300 === 0) {
                const fps = 1000 * frameCount / (now - startTime);
                console.log(`frame ${frameCount}  fps: ${fps.toFixed(1)}  particles: ${PARTICLE_COUNT}`);
            }
            if ((now - startTime) / 1000 > 60 && shouldLog) {
                shouldLog = false;
                const fps = 1000 * frameCount / (now - startTime);
                console.log('1min result', fps.toFixed(1), 'fps', 'particles:', PARTICLE_COUNT);
            }
        }
    </script>
</body>

</html>
