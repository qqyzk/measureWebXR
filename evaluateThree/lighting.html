<!DOCTYPE html>
<html lang="en">

<head>
    <title>GLTF Lighting Benchmark</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: monospace;
        }

        #controls {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            color: #fff;
            background: rgba(0, 0, 0, 0.65);
            padding: 10px;
            border-radius: 6px;
        }

        #controls label,
        #controls select,
        #controls input {
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div id="controls">
        <input id="button" type="button" value="start">
        <label for="light-mode">light mode:</label>
        <select id="light-mode">
            <option value="env">env(RoomEnvironment)</option>
            <option value="ambient-directional">ambient + directional</option>
            <option value="hemisphere-directional">hemisphere + directional</option>
            <option value="point">point</option>
            <option value="spot">spot</option>
        </select>
        <label for="shading-mode">shading:</label>
        <select id="shading-mode">
            <option value="gltf-original">gltf-original</option>
            <option value="phong">phong</option>
            <option value="pbr">pbr(forced)</option>
        </select>
    </div>

    <script type="module">
        import * as THREE from './src/three.module.js';
        import { GLTFLoader } from "./src/GLTFLoader2.js";
        import { RoomEnvironment } from "./src/RoomEnvironment2.js";
        import Stats from "./src/myStats.js";

        window.events = [];

        let name = 'Box';
        let type = 'gltf';
        let N =32;
        let LIGHT_MODE = 'env';
        let SHADING_MODE = 'phong';

        let camera, scene, renderer, stats;
        let loader;
        let loaded = false;
        let envTexture = null;
        let lightRoot = null;
        const modelRoots = [];
        const convertedMaterialCache = new Map();

        let startFlag = true;
        let frameCount = 0;
        let startTime = null;
        let shouldLog = true;
        let frameSum = 0;
        let clickTimeAbsMs = null;

        const btn = document.getElementById("button");
        const lightModeSelect = document.getElementById("light-mode");
        const shadingModeSelect = document.getElementById("shading-mode");
        lightModeSelect.value = LIGHT_MODE;
        shadingModeSelect.value = SHADING_MODE;

        lightModeSelect.addEventListener('change', (e) => {
            LIGHT_MODE = e.target.value;
            if (scene) {
                applyLighting(LIGHT_MODE);
                if (loaded) {
                    resetMetrics();
                }
                console.log('lighting mode switched:', LIGHT_MODE);
            }
        });

        shadingModeSelect.addEventListener('change', (e) => {
            SHADING_MODE = e.target.value;
            if (scene && loaded) {
                applyShadingMode(SHADING_MODE);
                applyLighting(LIGHT_MODE);
                resetMetrics();
                console.log('shading mode switched:', SHADING_MODE);
            }
        });

        btn.onclick = function conduct() {
            btn.disabled = true;
            const clickTimeMs = performance.now();
            clickTimeAbsMs = clickTimeMs + performance.timeOrigin;
            console.log('click time', clickTimeAbsMs);
            init();
            window.requestAnimationFrame(animate);
        };

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            stats = new Stats();
            stats.dom.style.top = '20px';
            stats.dom.style.left = '320px';
            container.appendChild(stats.dom);

            renderer = new THREE.WebGLRenderer({ alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 100);
            camera.position.set(0, 0, 0);

            lightRoot = new THREE.Group();
            lightRoot.name = 'lightRoot';
            scene.add(lightRoot);
            applyLighting(LIGHT_MODE);

            loader = new GLTFLoader();

            let url;
            if (name === 'Box' && type === 'gltf') {
                url = '../gltf/Box/box.gltf';
            } else if (name === 'Box' && type === 'glb') {
                url = '../gltf/Box/Box.glb';
            } else if (name === 'BoxTextured' && type === 'gltf') {
                url = '../gltf/BoxTextured4/BoxTextured.gltf';
            } else if (name === 'BoxTextured' && type === 'glb') {
                url = '../gltf/BoxTextured/BoxTextured.glb';
            } else if (name === 'BoomBox' && type === 'gltf') {
                url = '../gltf/BoomBox/BoomBox.gltf';
            } else if (name === 'BoomBox' && type === 'glb') {
                url = '../gltf/BoomBox/BoomBox.glb';
            } else if (name === 'DamagedHelmet' && type === 'gltf') {
                url = '../gltf/DamagedHelmet/DamagedHelmet.gltf';
            } else if (name === 'DamagedHelmet' && type === 'glb') {
                url = '../gltf/DamagedHelmet/DamagedHelmet.glb';
            } else if (name === 'Box6' && type === 'gltf') {
                url = '../gltf/BoxTextured2048/BoxTextured.gltf';
            }

            loader.load(url, function (gltf) {
                let minx = -0.5, miny = -0.8, minz = -20;
                let maxx = 0.5, maxy = 0.8, maxz = -3;
                let edgeNum = N;
                let scale;
                if (name === "Box") {
                    scale = 0.05;
                } else if (name === 'BoxTextured') {
                    scale = 0.05;
                } else if (name === 'BoomBox') {
                    scale = 4;
                } else if (name === 'DamagedHelmet') {
                    scale = 0.05;
                }

                const stepDenom = Math.max(1, edgeNum - 1);
                for (let i = 0; i < edgeNum; ++i) {
                    for (let j = 0; j < edgeNum; ++j) {
                        for (let k = 0; k < edgeNum; ++k) {
                            let curx = minx + (maxx - minx) / stepDenom * i;
                            let cury = miny + (maxy - miny) / stepDenom * j;
                            let curz = minz + (maxz - minz) / stepDenom * k;
                            let model = gltf.scene.clone();
                            rememberOriginalMaterials(model);
                            applyShadingToRoot(model, SHADING_MODE);
                            model.position.set(curx, cury, curz);
                            model.scale.set(scale, scale, scale);
                            scene.add(model);
                            modelRoots.push(model);
                        }
                    }
                }

                loaded = true;
                resetMetrics();
                const loadedMs = performance.now();
                const sceneLoadedTimeAbsMs = loadedMs + performance.timeOrigin;
                console.log('scene loaded time', sceneLoadedTimeAbsMs);
                if (clickTimeAbsMs) {
                    console.log('load duration', sceneLoadedTimeAbsMs - clickTimeAbsMs, 'ms');
                }
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function clearLightRoot() {
            while (lightRoot.children.length > 0) {
                const child = lightRoot.children[0];
                lightRoot.remove(child);
            }
        }

        function applyLighting(mode) {
            if (!scene || !lightRoot) return;
            clearLightRoot();

            scene.environment = null;

            if (mode === 'env') {
                scene.environment = envTexture;
                // Keep a small fill light so non-PBR materials (e.g. Phong) are still visible.
                const ambient = new THREE.AmbientLight(0xffffff, 0.28);
                const directional = new THREE.DirectionalLight(0xffffff, 1.0);
                directional.position.set(2, 5, 4);
                directional.castShadow = true;
                lightRoot.add(ambient);
                lightRoot.add(directional);
                return;
            }

            if (mode === 'ambient-directional') {
                const ambient = new THREE.AmbientLight(0xffffff, 0.45);
                const directional = new THREE.DirectionalLight(0xffffff, 1.8);
                directional.position.set(2, 5, 4);
                directional.castShadow = true;
                lightRoot.add(ambient);
                lightRoot.add(directional);
                return;
            }

            if (mode === 'hemisphere-directional') {
                const hemi = new THREE.HemisphereLight(0xffffff, 0x223344, 0.7);
                const directional = new THREE.DirectionalLight(0xffffff, 1.4);
                directional.position.set(3, 6, 4);
                directional.castShadow = true;
                lightRoot.add(hemi);
                lightRoot.add(directional);
                return;
            }

            if (mode === 'point') {
                const ambient = new THREE.AmbientLight(0xffffff, 0.2);
                const point = new THREE.PointLight(0xffffff, 30, 80);
                point.position.set(0, 3, -6);
                point.castShadow = true;
                lightRoot.add(ambient);
                lightRoot.add(point);
                return;
            }

            if (mode === 'spot') {
                const ambient = new THREE.AmbientLight(0xffffff, 0.15);
                const spot = new THREE.SpotLight(0xffffff, 40, 120, Math.PI / 6, 0.35);
                spot.position.set(0, 6, -6);
                spot.castShadow = true;
                const target = new THREE.Object3D();
                target.position.set(0, 0, -10);
                lightRoot.add(target);
                spot.target = target;
                lightRoot.add(ambient);
                lightRoot.add(spot);
                return;
            }
        }

        function resetMetrics() {
            startFlag = true;
            frameCount = 0;
            startTime = null;
            shouldLog = true;
            frameSum = 0;
        }

        function rememberOriginalMaterials(root) {
            root.traverse((node) => {
                if (!node.isMesh) return;
                if (node.userData.originalMaterial !== undefined) return;
                node.userData.originalMaterial = node.material;
            });
        }

        function applyShadingMode(mode) {
            for (let i = 0; i < modelRoots.length; i++) {
                applyShadingToRoot(modelRoots[i], mode);
            }
        }

        function applyShadingToRoot(root, mode) {
            root.traverse((node) => {
                if (!node.isMesh) return;
                const original = node.userData.originalMaterial;
                if (original === undefined) return;
                node.material = convertMaterial(original, mode);
            });
        }

        function convertMaterial(originalMaterial, mode) {
            if (Array.isArray(originalMaterial)) {
                const output = new Array(originalMaterial.length);
                for (let i = 0; i < originalMaterial.length; i++) {
                    output[i] = convertSingleMaterial(originalMaterial[i], mode);
                }
                return output;
            }
            return convertSingleMaterial(originalMaterial, mode);
        }

        function convertSingleMaterial(original, mode) {
            if (mode === 'gltf-original') {
                return original;
            }

            const cacheKey = `${mode}:${original.uuid}`;
            const cached = convertedMaterialCache.get(cacheKey);
            if (cached) return cached;

            let material = null;
            if (mode === 'phong') {
                material = makePhongMaterialFrom(original);
            } else if (mode === 'pbr') {
                material = makePBRMaterialFrom(original);
            }

            convertedMaterialCache.set(cacheKey, material);
            return material;
        }

        function makePhongMaterialFrom(src) {
            const m = new THREE.MeshPhongMaterial({
                color: src.color ? src.color.clone() : new THREE.Color(0xffffff),
                map: src.map || null,
                normalMap: src.normalMap || null,
                normalScale: src.normalScale ? src.normalScale.clone() : new THREE.Vector2(1, 1),
                emissive: src.emissive ? src.emissive.clone() : new THREE.Color(0x000000),
                emissiveMap: src.emissiveMap || null,
                emissiveIntensity: src.emissiveIntensity !== undefined ? src.emissiveIntensity : 1.0,
                transparent: !!src.transparent,
                opacity: src.opacity !== undefined ? src.opacity : 1.0,
                side: src.side !== undefined ? src.side : THREE.FrontSide,
                alphaTest: src.alphaTest !== undefined ? src.alphaTest : 0
            });
            m.specular = new THREE.Color(0x555555);
            m.shininess = 35;
            m.skinning = !!src.skinning;
            m.morphTargets = !!src.morphTargets;
            m.morphNormals = !!src.morphNormals;
            m.needsUpdate = true;
            return m;
        }

        function makePBRMaterialFrom(src) {
            // Force stable parameters so this mode is visually distinct from gltf-original.
            const forcedRoughness = 0.4;
            const forcedMetalness = 0.6;
            const m = new THREE.MeshStandardMaterial({
                color: src.color ? src.color.clone() : new THREE.Color(0xffffff),
                map: src.map || null,
                normalMap: src.normalMap || null,
                normalScale: src.normalScale ? src.normalScale.clone() : new THREE.Vector2(1, 1),
                roughness: forcedRoughness,
                metalness: forcedMetalness,
                roughnessMap: src.roughnessMap || null,
                metalnessMap: src.metalnessMap || null,
                emissive: src.emissive ? src.emissive.clone() : new THREE.Color(0x000000),
                emissiveMap: src.emissiveMap || null,
                emissiveIntensity: src.emissiveIntensity !== undefined ? src.emissiveIntensity : 1.0,
                transparent: !!src.transparent,
                opacity: src.opacity !== undefined ? src.opacity : 1.0,
                side: src.side !== undefined ? src.side : THREE.FrontSide,
                alphaTest: src.alphaTest !== undefined ? src.alphaTest : 0
            });
            m.skinning = !!src.skinning;
            m.morphTargets = !!src.morphTargets;
            m.morphNormals = !!src.morphNormals;
            m.needsUpdate = true;
            return m;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            let frameStart = performance.now();
            requestAnimationFrame(animate);

            let time = performance.now();
            stats.update(time);
            renderer.render(scene, camera);

            if (loaded) {
                let frameEnd = performance.now();
                frameSum += frameEnd - frameStart;

                if (startFlag) {
                    startTime = time;
                    startFlag = false;
                    console.log('startTime', performance.now() + performance.timeOrigin, 'light:', LIGHT_MODE, 'shading:', SHADING_MODE);
                }

                frameCount += 1;
                if (frameCount % 1000 === 0) {
                    let fps = 1000 * frameCount / (time - startTime);
                    let ft = frameSum / frameCount;
                    console.log('light:', LIGHT_MODE, 'shading:', SHADING_MODE, frameCount, fps, 'fps', ft, 'ft');
                }

                if ((time - startTime) / 1000 > 60 && shouldLog) {
                    shouldLog = false;
                    let fps = 1000 * frameCount / (time - startTime);
                    let ft = frameSum / frameCount;
                    console.log('1min', 'light:', LIGHT_MODE, 'shading:', SHADING_MODE, (time - startTime) / 1000, frameCount, fps, 'fps', ft, 'ft');
                }
            }
        }
    </script>
</body>

</html>
